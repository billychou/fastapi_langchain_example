[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + LangChain agent backend with SSE streaming"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv]
package = false
