[project]
name = "backend"
version = "0.2.0"
description = "FastAPI + LangChain agent backend with SSE streaming, integrated user & auth service (dual-token JWT, RBAC)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "pydantic-settings>=2.4",
    # ---- user & auth service ----
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "redis>=5.0",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "email-validator>=2.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv]
package = false
